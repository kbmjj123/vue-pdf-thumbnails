name: Release

# Auto-publish to npm on tag push. jsDelivr & unpkg then mirror the package
# automatically (no extra step), giving CDN external links out of the box.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # NPM_TOKEN must be added as a repo secret (Settings → Secrets → Actions).
      # `prepublishOnly` is skipped here because we already built above.
      - run: npm publish --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
